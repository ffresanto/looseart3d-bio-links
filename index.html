<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a1f35">
    <meta name="description" content="Produtos criativos em impressão 3D feitos com cuidado pela Loose Art 3D.">
    <meta property="og:title" content="Loose Art 3D" />
    <meta property="og:description" content="Peças criativas, modernas e feitas com muito cuidado através da tecnologia da impressão 3D." />
    <meta property="og:image" content="https://looseart3d.com/assets/logo_media.png" />
    <meta property="og:url" content="https://looseart3d.com/" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <title>Loose Art 3D - Produtos Criativos em Impressão 3D</title>
</head>

<body>
    <main class="page-shell">
        <section class="profile" aria-labelledby="store-title">
            <div class="brand-mark" aria-hidden="true">
                <img src="img/logo.png" alt="" width="500" height="500" fetchpriority="high" decoding="async">
            </div>

            <p class="eyebrow">Peças criativas em impressão 3D</p>
            <h1 id="store-title">Loose Art 3D</h1>
            <p class="intro">
                Decoração, presentes e acessórios feitos com cuidado, acabamento caprichado e carinho em cada detalhe.
            </p>

            <div class="highlights" aria-label="Destaques da loja">
                <span>Feito sob demanda</span>
                <span>Design criativo</span>
                <span>Compra segura</span>
            </div>

            <nav class="links" aria-label="Links da Loose Art 3D">
                <a href="https://shopee.com.br/looseart3d" class="store-link" target="_blank" rel="noopener noreferrer">
                    <span class="link-icon">
                        <img src="assets/shopee.png" alt="" width="30" height="30" loading="lazy" decoding="async">
                    </span>
                    <span>
                        <strong>Comprar na Shopee</strong>
                        <small>Veja produtos, preços e avaliações</small>
                    </span>
                    <span class="arrow" aria-hidden="true">
                        <img src="img/arrow_forward.svg" alt="" width="24" height="24" loading="lazy" decoding="async">
                    </span>
                </a>

                <button class="store-link share-link" type="button" data-share-url="https://looseart3d.com" aria-live="polite">
                    <span class="link-icon share-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" role="img" focusable="false" fill="currentColor">
                            <path d="M18 16.1c-1.1 0-2.1.5-2.7 1.3L8.9 13.7c.1-.3.1-.5.1-.7s0-.4-.1-.7l6.3-3.7c.7.8 1.7 1.3 2.8 1.3 2.1 0 3.8-1.7 3.8-3.8S20.1 2.3 18 2.3s-3.8 1.7-3.8 3.8c0 .2 0 .4.1.7L8 10.5C7.3 9.7 6.3 9.2 5.2 9.2 3.1 9.2 1.4 10.9 1.4 13s1.7 3.8 3.8 3.8c1.1 0 2.1-.5 2.8-1.3l6.3 3.8c0 .2-.1.4-.1.6 0 2.1 1.7 3.8 3.8 3.8s3.8-1.7 3.8-3.8-1.7-3.8-3.8-3.8Z" />
                        </svg>
                    </span>
                    <span>
                        <strong>Compartilhar página</strong>
                        <small>Envie o link da Loose Art 3D</small>
                    </span>
                    <span class="arrow" aria-hidden="true">
                        <img src="img/arrow_outward.svg" alt="" width="24" height="24" loading="lazy" decoding="async">
                    </span>
                </button>
            </nav>
        </section>
    </main>

    <footer class="footer">
        Desenvolvido por Franccesco Felipe
    </footer>

    <script>
        const shareButton = document.querySelector(".share-link");

        if (shareButton) {
            const shareText = shareButton.querySelector("small");
            const originalText = shareText.textContent;
            const shareUrl = shareButton.dataset.shareUrl;

            shareButton.addEventListener("click", async () => {
                const shareData = {
                    title: "Loose Art 3D",
                    text: "Conheça a Loose Art 3D",
                    url: shareUrl,
                };

                try {
                    if (navigator.share) {
                        await navigator.share(shareData);
                        return;
                    }

                    await navigator.clipboard.writeText(shareUrl);
                    shareText.textContent = "Link copiado!";
                    window.setTimeout(() => {
                        shareText.textContent = originalText;
                    }, 2200);
                } catch (error) {
                    if (error.name !== "AbortError") {
                        shareText.textContent = "Não foi possível compartilhar";
                        window.setTimeout(() => {
                            shareText.textContent = originalText;
                        }, 2200);
                    }
                }
            });
        }
    </script>
</body>

</html>
